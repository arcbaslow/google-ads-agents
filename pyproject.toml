[project]
name = "google-ads-agents"
version = "0.1.0"
description = "Multi-agent toolkit for Google Ads with end-user gcloud SSO and 24h session cap"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "google-ads>=25.0.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py310"
