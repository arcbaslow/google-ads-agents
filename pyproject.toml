[project]
name = "google-ads-agents"
version = "0.6.0"
description = "Multi-agent toolkit for Google Ads. End-user gcloud SSO, per-MCC profiles, 24h session cap. Read paths across all campaign types, conversion and Google tag health, placement safety, gated mutates."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "arcbaslow" },
]
keywords = [
    "google-ads", "google-ads-api", "ppc", "adwords", "claude-code",
    "multi-agent", "performance-max", "keyword-research",
    "conversion-tracking", "placement-safety", "marketing-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "google-ads>=25.0.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1,<8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/arcbaslow/google-ads-agents"
Repository = "https://github.com/arcbaslow/google-ads-agents"
Changelog = "https://github.com/arcbaslow/google-ads-agents/blob/master/CHANGELOG.md"
Issues = "https://github.com/arcbaslow/google-ads-agents/issues"

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly. Ruff's implicit default rule set changes between
# releases, which turns an unrelated ruff upgrade into a red CI run.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
# Two independent suites: the CLI adapters and the optional hosted
# sign-in service. webapp/ needs webapp/requirements.txt installed.
testpaths = ["scripts", "webapp/tests"]
python_files = ["test_*.py"]
